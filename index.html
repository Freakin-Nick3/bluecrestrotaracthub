<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b8f">
<meta name="description" content="BlueCrest Rotaract Hub — member, executive, project and club management PWA.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/social-members.css">
<link rel="stylesheet" href="css/public-articles.css">
<title>BlueCrest Rotaract Hub</title>
<script>
function loadSupabaseFallback(){
  if(window.supabase?.createClient){window.dispatchEvent(new Event('supabase-ready'));return}
  const fallback=document.createElement('script');
  fallback.src='https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js';
  fallback.onload=()=>window.dispatchEvent(new Event('supabase-ready'));
  fallback.onerror=()=>console.error('Could not load the Supabase client from either CDN.');
  document.head.appendChild(fallback);
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onload="window.dispatchEvent(new Event('supabase-ready'))" onerror="loadSupabaseFallback()"></script>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app"></div>
<script defer src="js/app.js"></script>
</body>
</html>
